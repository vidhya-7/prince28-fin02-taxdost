
name: Nightly Health Check

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check live health endpoint
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 10 \
            "$LIVE_URL/health"
